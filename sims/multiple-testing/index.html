<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>edu_sims</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <script src="../../shared/sim.js"></script>
  <!-- 차트: Observable Plot (d3가 먼저 있어야 함). 버전 고정 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/dist/plot.umd.min.js"></script>
  <style>
    /* 넓은 화면: 왼쪽에 조작·표, 오른쪽에 숫자·그래프. 좁은 화면: 조작 → 숫자 → 그래프 → 표 */
    .mt-layout { grid-template-areas: "panel" "figs" "table"; }
    @media (min-width: 720px) {
      .mt-layout { grid-template-areas: "panel figs" "table figs"; grid-template-rows: auto 1fr; }
    }
    .mt-layout > .panel { grid-area: panel; }
    .mt-layout > .table-card { grid-area: table; }
    .mt-layout > .sim-figs { grid-area: figs; }
    .panel .seg label { flex: 1 1 auto; }
    .panel .seg span { padding-left: 0.3rem; padding-right: 0.3rem; }

    .stats-card .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stats-card .stat .v { font-size: 1.75rem; font-variant-numeric: tabular-nums; }
    .stats-card .stat .sub { font-size: 0.75rem; color: var(--muted); line-height: 1.3; }

    .fig-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.25rem; }
    .fig-head .card-title { margin: 0; }
    .fig-head .seg { flex: none; }
    .fig-head .seg label { flex: none; }

    table.ct { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 0.85rem; table-layout: fixed; }
    table.ct th { overflow-wrap: normal; font-weight: 600; color: var(--ink-2); text-align: center; padding: 0.2rem; }
    table.ct th[scope="row"] { text-align: left; }
    table.ct td { background: var(--page); border-radius: 8px; text-align: center; padding: 0.3rem 0.2rem; line-height: 1.25; }
    table.ct td .n { display: block; white-space: nowrap; font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    table.ct td .lab { display: block; font-size: 0.7rem; color: var(--ink-2); }
    table.ct td.fp { background: #fbe9e7; box-shadow: inset 0 0 0 1.5px #e7a197; }
    table.ct td.sum, table.ct tr.sum td { background: transparent; color: var(--ink-2); }
    table.ct .sw { width: 0.65rem; height: 0.65rem; border-radius: 3px; display: inline-block; margin-right: 0.3rem; vertical-align: baseline; }
    table.ct th:first-child, table.ct thead td:first-child { width: 26%; }
  </style>
</head>
<body>
  <main class="sim">
    <h1 class="sim-question" data-t="question"></h1>

    <div class="sim-layout mt-layout">
      <section class="card panel" aria-labelledby="panel-title">
        <h2 class="card-title" id="panel-title" data-t="panel"></h2>

        <div class="ctrl">
          <div class="ctrl-head"><label for="m" data-t="m"></label><output for="m" data-out="m"></output></div>
          <input type="range" id="m" data-param="m">
        </div>
        <div class="ctrl">
          <div class="ctrl-head"><label for="pi1" data-t="pi1"></label><output for="pi1" data-out="pi1"></output></div>
          <input type="range" id="pi1" data-param="pi1">
        </div>
        <div class="ctrl">
          <div class="ctrl-head"><label for="effect" data-t="effect"></label><output for="effect" data-out="effect"></output></div>
          <input type="range" id="effect" data-param="effect">
        </div>
        <div class="ctrl">
          <div class="ctrl-head"><label for="alpha" id="alpha-label"></label><output for="alpha" data-out="alpha"></output></div>
          <input type="range" id="alpha" data-param="alpha">
        </div>
        <div class="ctrl">
          <div class="ctrl-head"><span class="label" id="method-label" data-t="method"></span></div>
          <div class="seg" role="radiogroup" aria-labelledby="method-label">
            <label><input type="radio" name="method" value="none"><span data-t="none"></span></label>
            <label><input type="radio" name="method" value="bonf"><span data-t="bonf"></span></label>
            <label><input type="radio" name="method" value="bh"><span data-t="bh"></span></label>
          </div>
        </div>

        <div class="seed-row">
          <button type="button" class="btn" data-action="reroll" data-t="reroll"></button>
          <span class="seed" data-seed></span>
        </div>
      </section>


      <section class="card table-card" aria-labelledby="table-title">
        <h2 class="card-title" id="table-title" data-t="tableTitle"></h2>
        <table class="ct">
          <thead>
            <tr><td class="sum"></td><th scope="col" data-t="colSig"></th><th scope="col" data-t="colNon"></th><th scope="col" data-t="colSum"></th></tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row"><span class="sw" style="background: var(--c1)"></span><span data-t="rowNull"></span></th>
              <td class="fp"><span class="n" id="ct-fp"></span><span class="lab" data-t="FP"></span></td>
              <td><span class="n" id="ct-tn"></span><span class="lab" data-t="TN"></span></td>
              <td class="sum"><span class="n" id="ct-m0"></span></td>
            </tr>
            <tr>
              <th scope="row"><span class="sw" style="background: var(--c2)"></span><span data-t="rowAlt"></span></th>
              <td><span class="n" id="ct-tp"></span><span class="lab" data-t="TP"></span></td>
              <td><span class="n" id="ct-fn"></span><span class="lab" data-t="FN"></span></td>
              <td class="sum"><span class="n" id="ct-m1"></span></td>
            </tr>
            <tr class="sum">
              <th scope="row" data-t="colSum"></th>
              <td><span class="n" id="ct-r"></span></td>
              <td><span class="n" id="ct-nr"></span></td>
              <td><span class="n" id="ct-m"></span></td>
            </tr>
          </tbody>
        </table>
      </section>

      <div class="sim-figs">
        <section class="card stats-card" aria-live="polite">
          <div class="stats">
            <div class="stat"><div class="k" data-t="statR"></div><div class="v" id="stat-r"></div></div>
            <div class="stat"><div class="k" data-t="statFDR"></div><div class="v" id="stat-fdr"></div><div class="sub" data-t="statFDRsub"></div></div>
            <div class="stat"><div class="k" data-t="statPower"></div><div class="v" id="stat-power"></div><div class="sub" data-t="statPowerSub"></div></div>
          </div>
        </section>

        <figure class="card fig">
          <div class="fig-head">
            <figcaption class="card-title" data-t="histTitle"></figcaption>
            <div class="seg" role="radiogroup" data-t-aria="histTitle">
              <label><input type="radio" name="hist" value="stack"><span data-t="stack"></span></label>
              <label><input type="radio" name="hist" value="pool"><span data-t="pool"></span></label>
            </div>
          </div>
          <div id="hist"></div>
          <div class="legend" id="hist-legend-stack">
            <span class="key"><span class="sw" style="background: var(--c1)"></span><span data-t="legendNull"></span></span>
            <span class="key"><span class="sw" style="background: var(--c2)"></span><span data-t="legendAlt"></span></span>
          </div>
          <div class="legend" id="hist-legend-pool">
            <span class="key"><span class="sw" style="background: var(--c-neutral)"></span><span data-t="legendPool"></span></span>
          </div>
        </figure>

        <figure class="card fig">
          <figcaption class="card-title" data-t="sortedTitle"></figcaption>
          <div id="sorted"></div>
          <div class="legend">
            <span class="key"><span class="sw" style="background: var(--c1)"></span><span data-t="legendNull"></span></span>
            <span class="key"><span class="sw" style="background: var(--c2)"></span><span data-t="legendAlt"></span></span>
            <span class="key"><span class="dot fill"></span><span data-t="legendSig"></span></span>
            <span class="key"><span class="dot"></span><span data-t="legendNonSig"></span></span>
            <span class="key"><span class="ln" style="border-color: var(--c3)"></span><span data-t="legendBH"></span></span>
            <span class="key"><span class="ln dash" style="border-color: var(--c4)"></span><span data-t="legendBonf"></span></span>
            <span class="key" id="legend-alpha"><span class="ln dot-line" style="border-color: var(--ink-2)"></span><span data-t="legendAlpha"></span></span>
          </div>
        </figure>
      </div>
    </div>

    <section class="card tasks">
      <h2 data-t="tasksTitle"></h2>
      <ol>
        <li data-t-html="task1"></li>
        <li data-t-html="task2"></li>
        <li data-t-html="task3"></li>
      </ol>
    </section>

    <details class="card explain">
      <summary data-t="explainTitle"></summary>
      <div data-t-html="explain"></div>
    </details>
  </main>

  <script src="text.js"></script>
  <script src="model.js"></script>
  <script src="main.js"></script>
</body>
</html>
