<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>edu_sims</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <script src="../../shared/sim.js"></script>
  <!-- 차트: Observable Plot (d3가 먼저 있어야 함). 버전 고정 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/dist/plot.umd.min.js"></script>
  <style>
    .context { margin: -0.5rem 0 0; color: var(--ink-2); max-width: 52rem; }
    .stats-card .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stats-card .stat .v { font-size: 1.4rem; font-variant-numeric: tabular-nums; }

    .coefs { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
    .coefs td { padding: 0.12rem 0; }
    .coefs td.v { text-align: right; font-weight: 650; padding-right: 0.5rem; }
    .coefs td.t { color: var(--muted); font-size: 0.78rem; }
    .coefs tr.zero td.v { color: var(--muted); font-weight: 400; }
    .coefs .sw { width: 0.6rem; height: 0.6rem; border-radius: 50%; display: inline-block; margin-right: 0.35rem; }
    .note { font-size: 0.8rem; color: var(--muted); margin: -0.2rem 0 0.2rem; }

    .figs-row { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
    @media (min-width: 1100px) { .figs-row { grid-template-columns: 1fr 1fr; } }
    #geo { margin: 0 auto; }
    .explain figure { margin: 0.75rem 0 0; }
    .explain figcaption { font-size: 0.85rem; color: var(--ink-2); }
  </style>
</head>
<body>
  <main class="sim">
    <h1 class="sim-question" data-t="question"></h1>
    <p class="context" data-t="context"></p>

    <div class="sim-layout">
      <section class="card panel" aria-labelledby="panel-title">
        <h2 class="card-title" id="panel-title" data-t="panel"></h2>

        <div class="ctrl">
          <div class="ctrl-head"><span class="label" id="method-label" data-t="method"></span></div>
          <div class="seg" role="radiogroup" aria-labelledby="method-label">
            <label><input type="radio" name="method" value="ridge"><span>Ridge</span></label>
            <label><input type="radio" name="method" value="lasso"><span>Lasso</span></label>
          </div>
        </div>
        <div class="ctrl">
          <div class="ctrl-head"><label for="loglam" data-t="loglam"></label><output for="loglam" data-out="loglam"></output></div>
          <input type="range" id="loglam" data-param="loglam">
        </div>
        <div class="ctrl">
          <div class="ctrl-head"><label for="rho" data-t="rho"></label><output for="rho" data-out="rho"></output></div>
          <input type="range" id="rho" data-param="rho">
        </div>
        <label class="check"><input type="checkbox" data-param="truth"><span data-t="showTruth"></span></label>
        <div class="seed-row">
          <button type="button" class="btn" data-action="reroll" data-t="reroll"></button>
          <span class="seed" data-seed></span>
        </div>

        <h3 class="panel-sub" data-t="coefHead"></h3>
        <table class="coefs" id="coefs"></table>
      </section>

      <div class="sim-figs">
        <section class="card stats-card" aria-live="polite">
          <div class="stats">
            <div class="stat"><div class="k" data-t="statNonzero"></div><div class="v" id="stat-nz"></div></div>
            <div class="stat"><div class="k" data-t="statTest"></div><div class="v" id="stat-test"></div></div>
            <div class="stat"><div class="k" data-t="statBest"></div><div class="v" id="stat-best"></div></div>
          </div>
        </section>

        <figure class="card fig">
          <figcaption class="card-title" data-t="pathTitle"></figcaption>
          <div id="path"></div>
          <div class="legend">
            <span class="key"><span class="ln" style="border-color: var(--c1)"></span><span class="ln" style="border-color: var(--c2)"></span><span class="ln" style="border-color: var(--c3)"></span><span data-t="legendSignal"></span></span>
            <span class="key"><span class="ln" style="border-color: var(--c-neutral)"></span><span data-t="legendNoise"></span></span>
            <span class="key" id="legend-truth"><span class="ln dash" style="border-color: var(--ink-2)"></span><span data-t="legendTruthLine"></span></span>
            <span class="key"><span class="ln" style="border-color: var(--ink)"></span><span data-t="legendNow"></span></span>
          </div>
        </figure>

        <div class="figs-row">
          <figure class="card fig">
            <figcaption class="card-title" data-t="errTitle"></figcaption>
            <div id="err"></div>
            <div class="legend">
              <span class="key"><span class="ln" style="border-color: var(--c-neutral)"></span><span data-t="legendTrain"></span></span>
              <span class="key"><span class="ln" style="border-color: var(--c4)"></span><span data-t="legendTest"></span></span>
            </div>
          </figure>

          <figure class="card fig">
            <figcaption class="card-title" data-t="geoTitle"></figcaption>
            <p class="note" data-t="geoNote"></p>
            <div id="geo"></div>
            <div class="legend">
              <span class="key"><span class="dot"></span><span data-t="legendOls"></span></span>
              <span class="key"><span class="ln" style="border-color: var(--c4)"></span><span data-t="legendContour"></span></span>
              <span class="key"><span class="sw" style="background: var(--c3); opacity: 0.35"></span><span id="legend-region"></span></span>
              <span class="key"><span class="dot fill" style="background: var(--c2); border-color: var(--c2)"></span><span data-t="legendSol"></span></span>
            </div>
          </figure>
        </div>
      </div>
    </div>

    <section class="card tasks">
      <h2 data-t="tasksTitle"></h2>
      <ol>
        <li data-t-html="task1"></li>
        <li data-t-html="task2"></li>
        <li data-t-html="task3"></li>
      </ol>
    </section>

    <details class="card explain" id="explain">
      <summary data-t="explainTitle"></summary>
      <div data-t-html="explain"></div>
      <figure>
        <div id="prior"></div>
        <figcaption data-t="priorCap"></figcaption>
      </figure>
    </details>
  </main>

  <script src="text.js"></script>
  <script src="model.js"></script>
  <script src="main.js"></script>
</body>
</html>
