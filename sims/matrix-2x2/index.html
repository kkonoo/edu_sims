<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>edu_sims</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <script src="../../shared/sim.js"></script>
  <!-- 이 시뮬레이터는 격자·화살표·드래그뿐이라 차트 라이브러리 없이 SVG를 직접 그립니다 -->
  <style>
    .entries { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem 0.9rem; }
    .entries .ctrl-head label { font-family: ui-serif, Georgia, serif; font-style: italic; font-size: 1.05rem; }
    .col1 { --col: var(--c2); }
    .col2 { --col: var(--c1); }
    .entries .ctrl { border-left: 3px solid var(--col); padding-left: 0.5rem; }
    .entries .ctrl-head input[type="number"] { width: 4rem; }
    .presets { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    .hint { font-size: 0.8rem; color: var(--muted); margin: -0.3rem 0 0; }

    .nums { display: grid; grid-template-columns: auto 1fr; gap: 0.75rem 1rem; align-items: center; }
    .mat { display: inline-grid; grid-template-columns: auto auto; gap: 0.1rem 0.8rem; padding: 0.2rem 0.6rem; position: relative;
      font-variant-numeric: tabular-nums; font-size: 1.15rem; font-weight: 650; text-align: right; }
    .mat::before, .mat::after { content: ""; position: absolute; top: 0; bottom: 0; width: 0.4rem; border: 2px solid var(--ink); }
    .mat::before { left: 0; border-right: 0; }
    .mat::after { right: 0; border-left: 0; }
    .mat .c1 { color: var(--c2); }
    .mat .c2 { color: var(--c1); }
    .nums .k { font-size: 0.8rem; color: var(--ink-2); }
    .nums .v { font-variant-numeric: tabular-nums; }
    .nums .sub { font-size: 0.85rem; color: var(--ink-2); }
    .relation { grid-column: 1 / -1; font-size: 0.85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

    #plane { position: relative; width: 100%; max-width: 40rem; margin: 0 auto; }
    #plane svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
    #plane .hit { fill: transparent; cursor: grab; touch-action: none; }
    #plane.dragging .hit { cursor: grabbing; }
    .legend .knob { width: 0.7rem; height: 0.7rem; border-radius: 50%; display: inline-block; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
  </style>
</head>
<body>
  <main class="sim">
    <h1 class="sim-question" data-t="question"></h1>

    <div class="sim-layout">
      <section class="card panel" aria-labelledby="panel-title">
        <h2 class="card-title" id="panel-title" data-t="panel"></h2>

        <h3 class="panel-sub" data-t="matrixHead"></h3>
        <div class="entries">
          <div class="ctrl col1">
            <div class="ctrl-head"><label for="a">a</label><input type="number" data-param="a" aria-label="a"></div>
            <input type="range" id="a" data-param="a">
          </div>
          <div class="ctrl col2">
            <div class="ctrl-head"><label for="b">b</label><input type="number" data-param="b" aria-label="b"></div>
            <input type="range" id="b" data-param="b">
          </div>
          <div class="ctrl col1">
            <div class="ctrl-head"><label for="c">c</label><input type="number" data-param="c" aria-label="c"></div>
            <input type="range" id="c" data-param="c">
          </div>
          <div class="ctrl col2">
            <div class="ctrl-head"><label for="d">d</label><input type="number" data-param="d" aria-label="d"></div>
            <input type="range" id="d" data-param="d">
          </div>
        </div>
        <p class="hint" data-t="dragHint"></p>

        <h3 class="panel-sub" data-t="presetHead"></h3>
        <div class="presets">
          <button type="button" class="btn btn-sm" data-set='{"a":1,"b":0,"c":0,"d":1,"t":1}' data-t="pIdentity"></button>
          <button type="button" class="btn btn-sm" data-set='{"a":0.87,"b":-0.5,"c":0.5,"d":0.87,"t":1}' data-t="pRotate"></button>
          <button type="button" class="btn btn-sm" data-set='{"a":2,"b":0,"c":0,"d":0.5,"t":1}' data-t="pStretch"></button>
          <button type="button" class="btn btn-sm" data-set='{"a":2,"b":0,"c":0,"d":2,"t":1}' data-t="pScale"></button>
          <button type="button" class="btn btn-sm" data-set='{"a":1,"b":1,"c":0,"d":1,"t":1}' data-t="pShear"></button>
          <button type="button" class="btn btn-sm" data-set='{"a":1,"b":0,"c":0,"d":-1,"t":1}' data-t="pReflect"></button>
          <button type="button" class="btn btn-sm" data-set='{"a":0.5,"b":0.5,"c":0.5,"d":0.5,"t":1}' data-t="pProject"></button>
          <button type="button" class="btn btn-sm" data-set='{"a":2,"b":1,"c":1,"d":2,"t":1}' data-t="pSymmetric"></button>
        </div>
        <div class="seed-row">
          <button type="button" class="btn" id="random" data-t="random"></button>
          <span class="seed" data-seed></span>
        </div>

        <div class="ctrl">
          <div class="ctrl-head"><label for="t" data-t="t"></label><output for="t" data-out="t"></output></div>
          <div class="row">
            <input type="range" id="t" data-param="t" style="flex: 1">
            <button type="button" class="btn btn-sm" id="play" data-t="play"></button>
          </div>
        </div>
        <label class="check"><input type="checkbox" data-param="eig"><span data-t="showEig"></span></label>
      </section>

      <div class="sim-figs">
        <section class="card" aria-live="polite">
          <div class="nums">
            <div>
              <div class="k" data-t="shownMatrix"></div>
              <div class="mat" id="mat"></div>
              <div class="k" id="t-note"></div>
            </div>
            <div>
              <div><span class="k" data-t="detLabel"></span> <b class="v" id="det"></b> <span class="sub" id="det-note"></span></div>
              <div><span class="k" data-t="eigLabel"></span> <b class="v" id="eig"></b></div>
              <div class="sub" id="eig-vec"></div>
            </div>
            <div class="relation" id="relation"></div>
          </div>
        </section>

        <figure class="card fig">
          <figcaption class="card-title" data-t="figTitle"></figcaption>
          <div id="plane"></div>
          <div class="legend">
            <span class="key"><span class="knob" style="background: var(--c2)"></span><span data-t="legendE1"></span></span>
            <span class="key"><span class="knob" style="background: var(--c1)"></span><span data-t="legendE2"></span></span>
            <span class="key"><span class="sw" style="background: var(--c-neutral); opacity: 0.3"></span><span data-t="legendSquare"></span></span>
            <span class="key"><span class="ln dash" style="border-color: var(--c3)"></span><span data-t="legendEig"></span></span>
            <span class="key"><span class="knob" style="background: var(--c4)"></span><span data-t="legendV"></span></span>
          </div>
        </figure>
      </div>
    </div>

    <section class="card tasks">
      <h2 data-t="tasksTitle"></h2>
      <ol>
        <li data-t-html="task1"></li>
        <li data-t-html="task2"></li>
        <li data-t-html="task3"></li>
      </ol>
    </section>

    <details class="card explain">
      <summary data-t="explainTitle"></summary>
      <div data-t-html="explain"></div>
    </details>
  </main>

  <script src="text.js"></script>
  <script src="model.js"></script>
  <script src="main.js"></script>
</body>
</html>
