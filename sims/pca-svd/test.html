        CELL_RAW_COS: [0.99999581373721325],
      };

      // 부호를 R에 맞춤: R 벡터에서 절댓값이 가장 큰 성분의 부호가 같도록 (u와 v는 같이 뒤집음)
      const signTo = (mine, ref) => {
        let i = 0;
        ref.forEach((x, j) => { if (Math.abs(x) > Math.abs(ref[i])) i = j; });
        return Math.sign(mine[i]) === Math.sign(ref[i]) ? 1 : -1;
      };
      const col = (flat, r, l) => flat.filter((_, idx) => idx % r === l); // 행 우선으로 펼친 행렬의 l번째 열
      const maxDiff = (a, b) => Math.max(...Array.from(a, (x, i) => Math.abs(x - b[i])));
      const mat = (rows) => ({ m: rows.length, n: rows[0].length, a: Float64Array.from(rows.flat()) });

      /* ---------------------------------------------------------------
       * 1. 작은 행렬: R svd()와 비교
       * --------------------------------------------------------------- */

      const w = 2 / 3;

        ['T1', '3 × 2', [[3, 1], [1, 3], [1, 1]], 2],
        ['T2', '2 × 4 (가로로 긴 행렬)', [[1, 2, 0, -1], [0, 1, 3, 2]], 2],

        ['T6', '1 × 4', [[3, 0, 4, 0]], 1],
      ];
      for (const [key, name, rows, rank] of SMALL) {
        const A = mat(rows), S = PS.svd(A), ref = R[key];
        const r = ref.d.length, d1 = ref.d[0];
        const errD = maxDiff(S.d, ref.d) / d1;
        // u, v를 비교할 성분: σ가 0이 아니고 다른 σ와 겹치지 않는 것
        const comps = [];
        for (let l = 0; l < rank; l++) {
          if (ref.d.every((x, j) => j === l || Math.abs(x - ref.d[l]) > 1e-8 * d1)) comps.push(l);
        }
        let errUV = 0;
        for (const l of comps) {
          const ru = col(ref.u, r, l), rv = col(ref.v, r, l), sg = signTo(S.u[l], ru);
          errUV = Math.max(errUV, maxDiff(S.u[l].map((x) => sg * x), ru), maxDiff(S.v[l].map((x) => sg * x), rv));
        }
        const rec = PS.approx(S, r);
        const errRec = maxDiff(rec, A.a);
        T.check(key + ': ' + name, errD < 1e-13 && errUV < 1e-12 && errRec < 1e-12 && S.rank === rank,

      }

        const S = PS.svd(mat(H));
        T.near('힐베르트 행렬의 가장 작은 특잇값 (상대오차)', S.d[4], R.T5.d[4], 1e-9);

      {
        const A = PS.image(1), S = PS.svd(A);

        T.check('특잇값 120개 모두 (각각 상대오차)', rel < 1e-11, '가장 큰 상대오차 ' + rel.toExponential(1));
        T.check('랭크 = 120 (R qr()$rank)', S.rank === R.IMG_RANK);
        const A5 = PS.approx(S, 5);
        const got = [A5[0], A5[59 * 120 + 59], A5[119 * 120 + 6], A5[32 * 120 + 100], PS.frob(A.a.map((x, i) => x - A5[i]))];
        const e = maxDiff(got, R.IMG_A5);
        T.check('랭크 5 근사의 원소 4개와 ‖A − A₅‖_F', e < 1e-11, '가장 큰 차이 ' + e.toExponential(1) + ' (‖A − A₅‖ = ' + got[4].toFixed(6) + ')');
      }

      /* ---------------------------------------------------------------
       * 3. 시드 1 세포 데이터 300 × 40: R prcomp()와 비교
       * --------------------------------------------------------------- */

      {
        const X = PS.cells(1), P = PS.decompose(X, true), n = X.m;
        const sdev = Array.from(P.d, (d) => d / Math.sqrt(n - 1));

        const cellsIdx = [0, 135, 225, 288, 299];
        for (let l = 0; l < 3; l++) {
          const rv = col(R.CELL_ROT, 3, l), sg = signTo(P.v[l], rv);
          eR = Math.max(eR, maxDiff(P.v[l].map((x) => sg * x), rv));
          const rx = col(R.CELL_X, 3, l);
          eX = Math.max(eX, maxDiff(cellsIdx.map((i) => sg * P.u[l][i] * P.d[l]), rx));
        }
        T.check('loading (rotation) PC1–3 = v (부호 맞춤)', eR < 1e-12, '가장 큰 차이 ' + eR.toExponential(1));
        T.check('점수 (x) PC1–3 = uσ, 유형 A·B·C·D 세포 5개', eX < 1e-11, '가장 큰 차이 ' + eX.toExponential(1));
        const cum = R.CELL_CUMVAR.map((_, k) => PS.tailError(P.d, k + 1).kept);
        const eC = maxDiff(cum, R.CELL_CUMVAR);
        T.check('누적 비율 PC1–5 (= 화면의 "설명 분산")', eC <= 5e-6, '화면 ' + cum.map((x) => x.toFixed(5)).join(', ') + ' / R ' + R.CELL_CUMVAR.join(', '));
        const U = PS.decompose(X, false);
        const eU = Math.max(...R.CELL_RAW_D.map((d, i) => Math.abs(U.d[i] - d) / d));
        T.check('중심화 안 함: svd(X)$d 앞 5개', eU < 1e-11, '가장 큰 상대오차 ' + eU.toExponential(1));
        const m = PS.colMeans(X), mn = Math.hypot(...m);
        const cos = Math.abs(U.v[0].reduce((s, x, j) => s + x * m[j], 0)) / mn;
        T.near('중심화 안 함: v₁과 평균 벡터의 cos', cos, R.CELL_RAW_COS[0], 1e-10);
      }

      /* ---------------------------------------------------------------
       * 4. 성질 — 여러 모양의 무작위 행렬
       * --------------------------------------------------------------- */
      T.section('성질: 직교성, 복원, 에카르트–영');
      {
        const rng = EduSim.rng(2024);
        const shapes = [[1, 1], [1, 6], [6, 1], [7, 3], [3, 7], [12, 12], [30, 8], [8, 30], [25, 25]];
        let eOrth = 0, eRec = 0, eEY = 0, ePiece = 0, eMean = 0, sorted = true, ranksOK = true, count = 0;
        for (let rep = 0; rep < 40; rep++) {
          for (const [m, n] of shapes) {
            // 짝수 번째는 랭크를 일부러 낮춤: (m × q)(q × n)
            const q = rep % 2 ? Math.min(m, n) : Math.max(1, Math.min(m, n) - 1 - (rep % 3));
            const L = Array.from({ length: m * q }, () => rng.normal()), Rt = Array.from({ length: q * n }, () => rng.normal());
            const a = new Float64Array(m * n);
            for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) for (let t = 0; t < q; t++) a[i * n + j] += L[i * q + t] * Rt[t * n + j];
            const A = { m, n, a }, S = PS.svd(A);
            count++;
            if (S.rank !== Math.min(q, m, n)) ranksOK = false;
            for (let l = 0; l < S.d.length; l++) if (S.d[l] < 0 || (l > 0 && S.d[l] > S.d[l - 1] + 1e-12)) sorted = false;
            for (let x = 0; x < S.rank; x++) {
              for (let y = 0; y < S.rank; y++) {
                const uu = S.u[x].reduce((s, v, i) => s + v * S.u[y][i], 0), vv = S.v[x].reduce((s, v, i) => s + v * S.v[y][i], 0);
                eOrth = Math.max(eOrth, Math.abs(uu - (x === y)), Math.abs(vv - (x === y)));
              }
            }
            const scale = PS.frob(a) || 1;
            eRec = Math.max(eRec, maxDiff(PS.approx(S, S.d.length), a) / scale);
            const k = 1 + (rep % Math.min(m, n));
            const Ak = PS.approx(S, k);
            eEY = Math.max(eEY, Math.abs(PS.frob(a.map((x, i) => x - Ak[i])) - PS.tailError(S.d, k).abs) / scale);
            const sum = new Float64Array(m * n);
            for (let l = 0; l < k; l++) PS.piece(S, l).forEach((x, i) => { sum[i] += x; });
            ePiece = Math.max(ePiece, maxDiff(sum, Ak) / scale);
            const mean = Array.from({ length: n }, () => rng.normal());
            const Am = PS.approx(S, k, mean);
            eMean = Math.max(eMean, Math.max(...Array.from(Am, (x, i) => Math.abs(x - Ak[i] - mean[i % n]))));
          }
        }
        T.check('UᵀU = VᵀV = I (σ > 0인 성분, 행렬 ' + count + '개)', eOrth < 1e-12, '가장 큰 차이 ' + eOrth.toExponential(1));
        T.check('A = UΣVᵀ (k = 전부일 때 원래 행렬)', eRec < 1e-13, '가장 큰 상대 차이 ' + eRec.toExponential(1));
        T.check('σ는 0 이상, 내림차순', sorted);
        T.check('랭크를 낮춰 만든 행렬의 랭크를 정확히 셈', ranksOK);
        T.check('‖A − Aₖ‖_F = √(버린 σ²의 합) (에카르트–영의 오차 공식)', eEY < 1e-12, '가장 큰 상대 차이 ' + eEY.toExponential(1));
        T.check('랭크-1 조각 k개의 합 = Aₖ', ePiece < 1e-13, '가장 큰 상대 차이 ' + ePiece.toExponential(1));
        T.check('평균을 더해 복원 (PCA): approx(S, k, mean) = Aₖ + 평균', eMean < 1e-13);
      }
      {
        // 에카르트–영의 "가장 가깝다": 무작위 k차원 부분공간에 사영한 랭크 k 행렬은 Aₖ보다 멀다
        const rng = EduSim.rng(7);
        const A = PS.cells(3), S = PS.svd(A);
        let worst = Infinity, tries = 0;
        for (const k of [1, 2, 3, 5]) {
          const best = PS.tailError(S.d, k).abs;
          for (let t = 0; t < 50; t++) {
            // 무작위 k차원: 앞 k개 특이벡터에 다음 2개를 조금 섞은 뒤 그람–슈미트 → Aₖ에 아주 가까운 경쟁자
            const Q = [];
            for (let c = 0; c < k; c++) {
              const v = new Float64Array(A.m);
              for (let l = 0; l < k + 2; l++) { const g = rng.normal() * (l < k ? 1 : 0.15); S.u[l].forEach((x, i) => { v[i] += g * x; }); }
              for (const qv of Q) { const dot = v.reduce((s, x, i) => s + x * qv[i], 0); qv.forEach((x, i) => { v[i] -= dot * x; }); }
              const nv = PS.frob(v); Q.push(v.map((x) => x / nv));
            }
            // B = QQᵀA
            const B = new Float64Array(A.m * A.n);
            for (const qv of Q) {
              for (let j = 0; j < A.n; j++) {
                let dot = 0; for (let i = 0; i < A.m; i++) dot += qv[i] * A.a[i * A.n + j];
                for (let i = 0; i < A.m; i++) B[i * A.n + j] += qv[i] * dot;
              }
            }
            worst = Math.min(worst, PS.frob(A.a.map((x, i) => x - B[i])) - best);
            tries++;
          }
        }
        T.check('랭크 k 경쟁자 ' + tries + '개 모두 ‖A − B‖ ≥ ‖A − Aₖ‖ (에카르트–영: Aₖ가 가장 가까움)', worst >= -1e-9, '가장 작은 차이 ' + worst.toExponential(2));
      }
      {
        // 반복 횟수: 회전한 열의 제곱 길이를 공식(α − tγ, β + tγ)으로 고치는 부분이 틀리면 결과는 맞아도 느려짐 → 화면이 끊김
        const img = [1, 2, 3, 4, 5].map((s) => PS.svd(PS.image(s)).sweeps);
        const cel = [];
        for (let s = 1; s <= 20; s++) cel.push(PS.decompose(PS.cells(s), true).sweeps, PS.decompose(PS.cells(s), false).sweeps);
        T.check('수렴 속도: 이미지(시드 1–5) 15번, 세포(시드 1–20, 중심화 켬·끔) 10번 이내 반복', Math.max(...img) <= 15 && Math.max(...cel) <= 10,
          '이미지 ' + img.join(', ') + ' / 세포 최대 ' + Math.max(...cel));
      }
      T.check('저장량 k(m+n+1)/mn: 120 × 120에서 k = 59는 원본보다 작고 k = 60은 큼 (설명의 "60을 넘으면")',
        PS.storage(120, 120, 59) < 1 && PS.storage(120, 120, 60) > 1 && Math.abs(PS.storage(1000, 1000, 50) - 0.10005) < 1e-12,
        'k = 59: ' + PS.storage(120, 120, 59).toFixed(4) + ', k = 60: ' + PS.storage(120, 120, 60).toFixed(4) + ', 1000², k = 50: ' + PS.storage(1000, 1000, 50));

      /* ---------------------------------------------------------------
       * 5. 설명에 쓴 말이 맞는지: 모양별 랭크
       * --------------------------------------------------------------- */
      T.section('설명 확인: 이미지 속 모양 하나씩의 랭크');
      {
        const N = PS.IMG_N;
        const rankOf = (f) => {
          const a = new Float64Array(N * N);
          for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) a[y * N + x] = f(x, y);
          return PS.svd({ m: N, n: N, a }).rank;
        };
        const sq = rankOf((x, y) => (Math.abs(x - 40) < 15 && Math.abs(y - 80) < 15 ? 1 : 0));
        const wave = rankOf((x, y) => Math.sin(x / 11 + 1) * Math.cos(y / 17 + 2));
        const disk = rankOf((x, y) => ((x - 80) ** 2 + (y - 40) ** 2 < 400 ? 1 : 0));
        const band = rankOf((x, y) => (Math.abs(x - y) < 4 ? 1 : 0));
        T.check('축에 나란한 정사각형: 랭크 1', sq === 1, '랭크 ' + sq);
        T.check('물결 sin x · cos y: 랭크 1', wave === 1, '랭크 ' + wave);
        T.check('원 (반지름 20): 여러 조각 (2 ~ 30)', disk >= 2 && disk <= 30, '랭크 ' + disk);
        T.check('대각선 띠: 거의 모든 조각 (≥ 110)', band >= 110, '랭크 ' + band);
      }

      /* ---------------------------------------------------------------
       * 6. 데이터와 시드
       * --------------------------------------------------------------- */
      T.section('데이터: 시드, 크기, 값의 범위');
      {
        const a1 = PS.image(5), a2 = PS.image(5), a3 = PS.image(6);
        T.check('이미지: 120 × 120, 같은 시드면 같고 다르면 다름', a1.m === 120 && a1.n === 120 && maxDiff(a1.a, a2.a) === 0 && maxDiff(a1.a, a3.a) > 0.1);
        const c1 = PS.cells(5), c2 = PS.cells(5), c3 = PS.cells(6);
        T.check('세포: 300 × 40, 같은 시드면 같고 다르면 다름', c1.m === 300 && c1.n === 40 && maxDiff(c1.a, c2.a) === 0 && maxDiff(c1.a, c3.a) > 0.1);
        let sortedTypes = true, nonneg = true, finite = true;
        for (let s = 1; s <= 50; s++) {
          const c = PS.cells(s);
          for (let i = 1; i < c.m; i++) if (c.type[i] < c.type[i - 1]) sortedTypes = false;
          if (!c.a.every((x) => x >= 0)) nonneg = false;
          if (!PS.image(s).a.every(Number.isFinite)) finite = false;
        }
        const counts = PS.TYPES.map((_, t) => PS.cells(1).type.filter((x) => x === t).length);
        T.check('세포 유형 수 A·B·C·D = 135·90·63·12, 유형 순서로 정렬 (시드 50개)', counts.join() === '135,90,63,12' && sortedTypes, counts.join(', '));
        T.check('발현값은 0 이상 (log 발현), 이미지 값은 유한 (시드 50개)', nonneg && finite);
        T.check('유전자 이름 40개, 묶음 A–D·H', PS.GENES.length === 40 && PS.GENES[0] === 'A1' && PS.GENES[39] === 'H10' && PS.GENE_BLOCK[24] === 3);
      }

      T.section('데이터가 의도대로인지 (시드 100개): 드문 유형 D는 PC3에, scree에서는 잡음 바로 위');
      {
        // 성분 l에서 유형 t와 나머지의 분리도: |평균 차| / 합동 표준편차
        const sep = (S, X, l, t) => {
          const a = [], b = [];
          S.u[l].forEach((u, i) => (X.type[i] === t ? a : b).push(u * S.d[l]));
          const mean = (v) => v.reduce((s, x) => s + x, 0) / v.length;
          const vr = (v) => { const m = mean(v); return v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1); };
          return Math.abs(mean(a) - mean(b)) / Math.sqrt((vr(a) + vr(b)) / 2);
        };
        let pc3 = 0, raw4 = 0, cosMin = 1, ratioMin = Infinity, ratioMax = 0, sepMin = Infinity;
        for (let s = 1; s <= 100; s++) {
          const X = PS.cells(s), P = PS.decompose(X, true), U = PS.decompose(X, false);
          const s3 = sep(P, X, 2, 3);
          sepMin = Math.min(sepMin, s3);
          if (s3 > 4 && sep(P, X, 0, 3) < 1.5 && sep(P, X, 1, 3) < 1.5 && sep(P, X, 3, 3) < 1.5) pc3++;
          if (sep(U, X, 3, 3) > 4) raw4++;
          const m = PS.colMeans(X);
          cosMin = Math.min(cosMin, Math.abs(U.v[0].reduce((t, x, j) => t + x * m[j], 0)) / Math.hypot(...m));
          const ratio = (P.d[2] / P.d[3]) ** 2;
          ratioMin = Math.min(ratioMin, ratio); ratioMax = Math.max(ratioMax, ratio);
        }
        T.check('중심화: D는 PC3에서만 갈림 (분리도 > 4, PC1·2·4에서는 < 1.5)', pc3 === 100, pc3 + ' / 100, PC3 분리도 최소 ' + sepMin.toFixed(1));
        T.check('중심화 안 함: D는 한 칸 뒤 PC4에서 갈림', raw4 === 100, raw4 + ' / 100');
        T.check('중심화 안 함: 첫 조각 v₁ ≈ 평균 방향 (cos > 0.99)', cosMin > 0.99, '가장 작은 cos ' + cosMin.toFixed(5));
        T.check('scree: PC3의 σ²는 PC4(잡음)의 1.4 ~ 3.5배 — 잡음보다 크지만 꺾인 곳(elbow)은 2로 보이기 쉬움', ratioMin >= 1.4 && ratioMax <= 3.5,
          'σ₃²/σ₄² ' + ratioMin.toFixed(2) + ' ~ ' + ratioMax.toFixed(2));
      }

      T.section('중심화 (PCA)');
      {
        const X = PS.cells(2), P = PS.decompose(X, true), m = PS.colMeans(X);
        T.check('decompose(…, true)는 열 평균을 기억', maxDiff(P.mean, m) === 0);
        const back = PS.approx(P, P.d.length, P.mean);
        T.check('k = 전부이면 평균을 더해 원래 행렬로', maxDiff(back, X.a) < 1e-12, '가장 큰 차이 ' + maxDiff(back, X.a).toExponential(1));
        const Xc = PS.center(X, m);
        T.check('중심화한 행렬의 열 평균 = 0', maxDiff(PS.colMeans(Xc), new Float64Array(X.n)) < 1e-12);
        T.check('decompose(…, false)는 평균이 없음 (그냥 SVD)', PS.decompose(X, false).mean === null);
      }
    });
  </script>
