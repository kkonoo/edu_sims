<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>테스트 · 최소제곱</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <script src="../../shared/sim.js"></script>
  <script src="../../shared/test.js"></script>
  <script src="model.js"></script>
</head>
<body>
  <main class="sim">
    <h1 class="sim-question">테스트: 최소제곱 (잔차·이상치·leverage)</h1>
    <p>계산 부분(<code>model.js</code>)만 검사합니다. 파일을 더블클릭해 열어도 됩니다.
      <a href="./">시뮬레이터로 돌아가기</a></p>
    <div id="test-results"></div>
  </main>

  <script>
    EduTest.run(function (T) {
      const maxRel = (got, exp) => Math.max(...exp.map((e, i) =>
        Number.isNaN(e) ? (Number.isNaN(got[i]) ? 0 : Infinity) : Math.abs(got[i] - e) / Math.max(Math.abs(e), 1e-300)));

      /* ---------------------------------------------------------------
       * 1. R lm과 비교 — 기댓값: R 4.5.1 (webR)에서
       *   fit <- lm(y ~ x); coef(fit); summary(fit)$r.squared; summary(fit)$sigma
       *   hatvalues(fit); rstandard(fit); cooks.distance(fit)        (sprintf("%.17g", …))
       * --------------------------------------------------------------- */
      const B = LS.PRESETS.clean;
      const R_SETS = [
        {
          name: '깨끗한 (프리셋)', pts: B,
          coef: [1.1404640516075355, 0.77041931120590956], r2: 0.96601664448146307, sigma: 0.31676506292190776,
          hat: [0.35646654874622863, 0.24243054833003833, 0.16996150244511493, 0.12813442929976068, 0.10300697117885757, 0.10175840183123505, 0.12922692747893039, 0.18057434189990634, 0.24487566330246588, 0.34356466548746223],
          rstd: [0.74422952900972184, -1.1868334022288174, 1.155562363111523, -1.1115323463267943, 0.77312309604154661, -1.1002378392281913, 1.1954244149474325, -0.99719433228998799, 0.9148021941298653, -0.34087164379065793],
          cook: [0.15340215276299224, 0.22537950229537465, 0.13671277760123196, 0.090788434229978954, 0.034319807935073526, 0.068567809000717586, 0.10603818249257341, 0.10956607128675237, 0.1356911607643585, 0.030406630435796483],
        },
        {
          name: '+ 이상치 (프리셋)', pts: LS.PRESETS.outlier,
          coef: [1.5877848161104304, 0.7562635908102483], r2: 0.5579039438246961, sigma: 1.3916994243444722,
          hat: [0.34518294412404305, 0.2317292237874633, 0.15975701994894576, 0.11834641202609433, 0.093693864044625139, 0.092842961142100791, 0.12082821215845704, 0.17261510825375817, 0.23728372884560833, 0.33639028079795774, 0.091330244870946389],
          rstd: [-0.21670580145468407, -0.61406392488511252, -0.061490877656345137, -0.56032041043319225, -0.12196130481847166, -0.53967043634299283, -0.015599087931870054, -0.51326348047736126, -0.085154119065280073, -0.3818285365601814, 2.9301106752392378],
          cook: [0.012377713500318455, 0.056867438402956716, 0.00035945658651735435, 0.021071720925397983, 0.00076886547225990716, 0.014903688620380866, 1.6721029875435074e-05, 0.027480330539363482, 0.0011279407120393646, 0.036951959358751389, 0.43146602423264019],
        },
        {
          name: '+ 지렛점 (프리셋)', pts: LS.PRESETS.leverage,
          coef: [1.0852698993595622, 0.7863677950594693], r2: 0.9806275529155446, sigma: 0.30283973325140723,
          hat: [0.28857435014261912, 0.21150637748237439, 0.15961196921586565, 0.12667509821861039, 0.10171680749152361, 0.091868037242344325, 0.095312415908723969, 0.11386631505301115, 0.14131370755072387, 0.18680372423443301, 0.48275119745977102],
          rstd: [0.89401911484067342, -1.1183238696729827, 1.2564259748713387, -1.1413406281208653, 0.78924345033821552, -1.1964495706411296, 1.1304351576115685, -1.1394804466054635, 0.72458858444916607, -0.53871037164671043, 0.49735780593605755],
          cook: [0.1621032866642747, 0.1677376196333967, 0.14990958926707315, 0.094474796351774859, 0.035267236030625718, 0.072405953498699022, 0.067315048670266539, 0.083421842738527596, 0.043201889357324601, 0.033332725636929419, 0.11543346896868163],
        },
        {
          name: '+ 영향점 (프리셋)', pts: LS.PRESETS.influential,
          coef: [2.903756525483022, 0.26091168397825726], r2: 0.1610721818319866, sigma: 1.6315203489134142,
          hat: [0.28857435014261912, 0.21150637748237439, 0.15961196921586565, 0.12667509821861039, 0.10171680749152361, 0.091868037242344325, 0.095312415908723969, 0.11386631505301115, 0.14131370755072387, 0.18680372423443301, 0.48275119745977102],
          rstd: [-0.77367227145439788, -0.80994138842254182, -0.10432578186729602, -0.33618905197962556, 0.26176942697237426, 0.095340007822877965, 0.79874044052700244, 0.6230291150684325, 1.1908014370471414, 1.235455445630447, -2.9493110996926117],
          cook: [0.121398207797736, 0.087983750495930269, 0.0010335676272093548, 0.0081969548574703215, 0.0038796030847813622, 0.00045976493645474088, 0.033607189826032745, 0.024939210986781722, 0.11668054935021042, 0.17531308401379031, 4.0591494426202983],
        },
        {
          name: 'x가 겹치는 점들', pts: '2,3;2,4;2,5;5,5;8,7;8,9',
          coef: [2.551724137931036, 0.65517241379310331], r2: 0.79457079970652977, sigma: 1.0985884360051026,
          hat: [0.31034482758620685, 0.31034482758620713, 0.31034482758620713, 0.17241379310344832, 0.44827586206896564, 0.44827586206896564],
          rstd: [-0.94491118252306716, 0.15118578920368977, 1.2472827609304495, -0.82807867121082557, -0.97192739293779429, 1.4790199457749049],
          cook: [0.20089285714285673, 0.0051428571428570732, 0.35003571428571445, 0.071428571428571536, 0.3837611607142859, 0.88867187500000111],
        },
        {
          name: 'leverage = 1인 점 (R도 NaN)', pts: '1,2;1,3;1,4;1,2.5;9,7',
          coef: [2.359375, 0.515625], r2: 0.86155063291139244, sigma: 0.85391256382996639,
          hat: [0.24999999999999992, 0.25, 0.25, 0.25, 1],
          rstd: [-1.1832159566199225, 0.16903085094570292, 1.5212776585113303, -0.50709255283711019, NaN],
          cook: [0.23333333333333292, 0.0047619047619047389, 0.3857142857142859, 0.042857142857142892, NaN],
        },
      ];
      T.section('R lm과 비교: 계수, R², σ̂, hatvalues, rstandard, cooks.distance');
      for (const c of R_SETS) {
        const f = LS.fit(LS.parse(c.pts));
        const e1 = maxRel([f.b0, f.b1, f.r2, f.sigma], [...c.coef, c.r2, c.sigma]);
        const e2 = maxRel(f.h, c.hat), e3 = maxRel(f.rstd, c.rstd), e4 = maxRel(f.cook, c.cook);
        const worst = Math.max(e1, e2, e3, e4);
        T.check(c.name + ' (n = ' + f.n + ')', worst <= 1e-12,
          '상대오차: 계수·R²·σ̂ ' + e1.toExponential(1) + ', h ' + e2.toExponential(1) + ', 표준화 잔차 ' + e3.toExponential(1) + ', Cook ' + e4.toExponential(1));
      }

      T.section('프리셋이 의도대로인지');
      {
        const last = (k) => { const f = LS.fit(LS.parse(LS.PRESETS[k])); const i = f.n - 1; return { f, h: f.h[i], r: f.rstd[i], d: f.cook[i] }; };
        const o = last('outlier'), l = last('leverage'), g = last('influential');
        T.check('+ 이상치: 표준화 잔차는 ±2 밖, leverage는 기준 아래', Math.abs(o.r) > 2 && o.h < o.f.hCut,
          'r = ' + o.r.toFixed(2) + ', h = ' + o.h.toFixed(3) + ' (기준 ' + o.f.hCut.toFixed(3) + ')');
        T.check('+ 지렛점: leverage는 기준 위, 표준화 잔차는 ±2 안, Cook < 1', l.h > l.f.hCut && Math.abs(l.r) < 2 && l.d < 1,
          'h = ' + l.h.toFixed(3) + ', r = ' + l.r.toFixed(2) + ', D = ' + l.d.toFixed(3));
        T.check('+ 영향점: leverage 기준 위, 표준화 잔차 ±2 밖, Cook > 1', g.h > g.f.hCut && Math.abs(g.r) > 2 && g.d > 1,
          'h = ' + g.h.toFixed(3) + ', r = ' + g.r.toFixed(2) + ', D = ' + g.d.toFixed(3));
      }

      /* ---------------------------------------------------------------
       * 2. 성질 — 시드로 만든 데이터 500세트
       * --------------------------------------------------------------- */
      T.section('성질: 잔차 ⟂ 열공간, Σh = p, Cook 거리 = 점을 뺀 적합의 변화');
      {
        let worstSumE = 0, worstSumEX = 0, worstSumH = 0, hRange = true, worstCook = 0, worstLoo = 0;
        for (let seed = 1; seed <= 500; seed++) {
          const pts = LS.generate(seed, 5 + (seed % 20));
          const f = LS.fit(pts);
          if (!f.ok) continue;
          const scale = Math.max(1, ...pts.map(([, y]) => Math.abs(y)));
          worstSumE = Math.max(worstSumE, Math.abs(f.resid.reduce((s, e) => s + e, 0)) / scale);
          worstSumEX = Math.max(worstSumEX, Math.abs(f.resid.reduce((s, e, i) => s + e * pts[i][0], 0)) / (scale * 10));
          worstSumH = Math.max(worstSumH, Math.abs(f.h.reduce((s, h) => s + h, 0) - LS.P));
          if (!f.h.every((h) => h >= 1 / f.n - 1e-12 && h <= 1 + 1e-12)) hRange = false;
          // Cook 거리를 정의대로: Dᵢ = Σⱼ (ŷⱼ − ŷⱼ(−i))² / (p σ̂²)
          const i = seed % pts.length;
          const g = LS.fitWithout(pts, i);
          if (g.ok && f.h[i] < 1 - 1e-9) {
            const shift = pts.reduce((s, [x], j) => s + (f.fitted[j] - (g.b0 + g.b1 * x)) ** 2, 0);
            worstCook = Math.max(worstCook, Math.abs(shift / (LS.P * f.sigma ** 2) - f.cook[i]) / Math.max(f.cook[i], 1e-12));
            // fitWithout = 그 점을 뺀 목록으로 직접 맞춘 것
            const direct = LS.fit(pts.filter((_, j) => j !== i));
            worstLoo = Math.max(worstLoo, Math.abs(direct.b1 - g.b1));
          }
        }
        T.check('잔차의 합 = 0', worstSumE < 1e-12, '가장 큰 값 ' + worstSumE.toExponential(1));
        T.check('잔차 × x의 합 = 0 (잔차가 x와 수직)', worstSumEX < 1e-12, '가장 큰 값 ' + worstSumEX.toExponential(1));
        T.check('leverage의 합 = p = 2', worstSumH < 1e-12, '가장 큰 차이 ' + worstSumH.toExponential(1));
        T.check('1/n ≤ leverage ≤ 1', hRange);
        T.check('Cook 거리 공식 = 점을 하나 빼고 다시 맞췄을 때 적합값이 바뀐 정도 (정의)', worstCook < 1e-9, '가장 큰 상대오차 ' + worstCook.toExponential(1));
        T.check('"점을 뺀 회귀선" = 그 점을 지운 데이터로 맞춘 선', worstLoo === 0);
      }

      T.section('기울기를 정할 수 없는 경우');
      T.check('x가 모두 같으면 ok = false', LS.fit(LS.parse('3,1;3,2;3,5')).ok === false);
      T.check('점이 2개면 직선은 있지만 σ̂는 정의되지 않음 (자유도 0)', (() => { const f = LS.fit([[1, 1], [2, 3]]); return f.ok && f.b1 === 2 && Number.isNaN(f.sigma); })());
      T.check('y가 모두 같으면 R²는 정의되지 않음', Number.isNaN(LS.fit(LS.parse('1,4;2,4;3,4')).r2));

      /* ---------------------------------------------------------------
       * 3. URL의 점 목록과 시드
       * --------------------------------------------------------------- */
      T.section('URL의 점 목록 (pts=x,y;x,y;…)');
      T.check('읽고 다시 쓰면 그대로', Object.values(LS.PRESETS).every((s) => LS.serialize(LS.parse(s)) === s));
      T.check('읽을 수 없는 조각은 버리고, 범위 밖은 0 ~ 10으로', JSON.stringify(LS.parse('1,2;abc;3,4,5;12,-1;')) === '[[1,2],[10,0]]',
        '실제 ' + JSON.stringify(LS.parse('1,2;abc;3,4,5;12,-1;')));
      T.check('0.1 단위로 맞춤', JSON.stringify(LS.parse('1.04,2.06')) === '[[1,2.1]]');
      T.check('빈 문자열 → 점 없음', LS.parse('').length === 0);

      T.section('다시 뽑기: 시드');
      {
        T.check('같은 시드면 같은 데이터', LS.serialize(LS.generate(7)) === LS.serialize(LS.generate(7)));
        T.check('시드가 다르면 다른 데이터', LS.serialize(LS.generate(7)) !== LS.serialize(LS.generate(8)));
        let inRange = true;
        for (let s = 1; s <= 1000; s++) {
          const pts = LS.generate(s);
          if (pts.length !== 12 || !pts.every(([x, y]) => x >= 0 && x <= 10 && y >= 0 && y <= 10 && Math.round(x * 10) === x * 10 && Math.round(y * 10) === y * 10)) inRange = false;
        }
        T.check('시드 1,000개: 12개 점이 모두 0 ~ 10 안, 0.1 단위', inRange);
      }
    });
  </script>
</body>
</html>
