<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>edu_sims</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <script src="../../shared/sim.js"></script>
  <!-- 차트: Observable Plot (d3가 먼저 있어야 함). 버전 고정 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/dist/plot.umd.min.js"></script>
  <style>
    .note { font-size: 0.8rem; color: var(--muted); margin: -0.3rem 0 0; }
    .panel .seg label { flex: 1 1 auto; }
    .panel .seg span { white-space: normal; line-height: 1.25; padding: 0.4rem 0.3rem; }

    .forest-rows { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.2rem 0.75rem; font-size: 0.9rem;
      font-variant-numeric: tabular-nums; margin-top: 0.25rem; }
    .forest-rows .v { text-align: right; font-weight: 650; white-space: nowrap; }
    .forest-rows .tag { font-size: 0.75rem; font-weight: 600; padding: 0 0.4rem; border-radius: 999px; margin-left: 0.3rem; }
    .forest-rows .tag.sig { background: var(--warn-bg); color: var(--warn-ink); }
    .forest-rows .tag.ns { background: var(--page); color: var(--ink-2); }
    .forest-rows .warn { color: var(--warn-ink); font-weight: 600; }
    .forest-rows .sw { width: 0.65rem; height: 0.65rem; border-radius: 50%; display: inline-block; margin-right: 0.35rem; }

    table.design { border-collapse: separate; border-spacing: 3px; font-variant-numeric: tabular-nums; margin-top: 0.25rem; }
    table.design th { font-weight: 600; color: var(--ink-2); padding: 0.15rem 0.5rem; text-align: center; font-size: 0.85rem; }
    table.design td { background: var(--page); border-radius: 8px; text-align: center; padding: 0.3rem 0.9rem; font-weight: 700; font-size: 1.05rem; }
    table.design td.zero { background: var(--warn-bg); color: var(--warn-ink); }
    table.design .sw { width: 0.6rem; height: 0.6rem; border-radius: 3px; display: inline-block; margin-right: 0.3rem; }
  </style>
</head>
<body>
  <main class="sim">
    <h1 class="sim-question" data-t="question"></h1>

    <div class="sim-layout">
      <section class="card panel" aria-labelledby="panel-title">
        <h2 class="card-title" id="panel-title" data-t="panel"></h2>

        <h3 class="panel-sub" id="mode-label" data-t="modeHead"></h3>
        <div class="seg" role="radiogroup" aria-labelledby="mode-label">
          <label><input type="radio" name="mode" value="cont"><span data-t="modeCont"></span></label>
          <label><input type="radio" name="mode" value="treat"><span data-t="modeTreat"></span></label>
        </div>

        <div class="panel" id="ctl-cont">
          <p class="note" data-t="contNote"></p>
          <div class="ctrl">
            <div class="ctrl-head"><label for="bc" data-t="bc"></label><output for="bc" data-out="bc"></output></div>
            <input type="range" id="bc" data-param="bc">
          </div>
          <div class="ctrl">
            <div class="ctrl-head"><label for="gc" data-t="gc"></label><output for="gc" data-out="gc"></output></div>
            <input type="range" id="gc" data-param="gc">
          </div>
          <div class="ctrl">
            <div class="ctrl-head"><label for="shift" data-t="shift"></label><output for="shift" data-out="shift"></output></div>
            <input type="range" id="shift" data-param="shift">
          </div>
        </div>

        <div class="panel" id="ctl-treat">
          <p class="note" data-t="treatNote"></p>
          <div class="ctrl">
            <div class="ctrl-head"><label for="bt" data-t="bt"></label><output for="bt" data-out="bt"></output></div>
            <input type="range" id="bt" data-param="bt">
          </div>
          <div class="ctrl">
            <div class="ctrl-head"><label for="gt" data-t="gt"></label><output for="gt" data-out="gt"></output></div>
            <input type="range" id="gt" data-param="gt">
          </div>
          <div class="ctrl">
            <div class="ctrl-head"><label for="frac" data-t="frac"></label><output for="frac" data-out="frac"></output></div>
            <input type="range" id="frac" data-param="frac">
          </div>
        </div>

        <label class="check"><input type="checkbox" data-param="batch"><span data-t="showBatch"></span></label>
        <div class="seed-row">
          <button type="button" class="btn" data-action="reroll" data-t="reroll"></button>
          <span class="seed" data-seed></span>
        </div>
      </section>

      <div class="sim-figs">
        <section class="card" aria-live="polite">
          <h2 class="card-title" data-t="forestTitle"></h2>
          <div id="forest"></div>
          <div class="forest-rows" id="forest-rows"></div>
        </section>

        <figure class="card fig">
          <figcaption class="card-title" id="main-title"></figcaption>
          <div id="main"></div>
          <div class="legend" id="main-legend"></div>
          <div id="design-wrap">
            <h3 class="card-title" style="margin-top: 0.75rem" data-t="designTitle"></h3>
            <table class="design" id="design"></table>
          </div>
        </figure>
      </div>
    </div>

    <section class="card tasks">
      <h2 data-t="tasksTitle"></h2>
      <ol>
        <li data-t-html="task1"></li>
        <li data-t-html="task2"></li>
        <li data-t-html="task3"></li>
      </ol>
    </section>

    <details class="card explain">
      <summary data-t="explainTitle"></summary>
      <div data-t-html="explain"></div>
    </details>
  </main>

  <script src="text.js"></script>
  <script src="model.js"></script>
  <script src="main.js"></script>
</body>
</html>
